name: Build Android APK

on:
  workflow_dispatch: 

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install npm dependencies
        run: npm install

      - name: Create Web Dir & Config
        run: |
          mkdir -p capacitor-web-dir
          echo "<html><body>Capacitor Web View</body></html>" > capacitor-web-dir/index.html
          echo '{"appId":"com.zomee.app","appName":"Zomee","webDir":"capacitor-web-dir","server":{"url":"https://zomee.vercel.app","cleartext":true}}' > capacitor.config.json

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          sed -i 's/\r$//' gradlew
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
